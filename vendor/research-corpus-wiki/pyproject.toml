[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-corpus-wiki"
version = "0.1.0"
description = "Portable research corpus, evidence ledger, and wiki skill"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10,<3", "ruamel.yaml>=0.18,<0.19", "markdown-it-py>=3,<4", "typer>=0.16,<1"]

[project.scripts]
rcw = "rcw_core.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "jsonschema>=4,<5", "ruff>=0.12,<1", "mypy>=1,<2"]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
