name: Maintenance

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [research-completed]
  push:
    branches: [main]
    paths: ["corpus/inbox/public/**"]

permissions:
  contents: write

concurrency:
  group: maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Verify pinned wiki kernel
        run: uv run --python 3.12 python scripts/verify_vendor.py
      - name: Receive public leads, refresh within budgets, build and audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --python 3.12 python scripts/run_maintenance.py
      # The pipeline exits nonzero on fatal receive/build/audit errors. A valid
      # partial refresh may publish its cursor and retained evidence before the
      # final report marks this run partial. The next run advances fairly.
      - name: Publish validated corpus changes
        shell: bash
        run: |
          git config user.name "map-the-agents-bot"
          git config user.email "actions@users.noreply.github.com"
          paths=(corpus/catalog corpus/sources corpus/wiki corpus/map corpus/AGENTS_CORPUS.md
                 corpus/state/catalog-cursor.json corpus/state/catalog-published.json
                 corpus/state/directory-cursor.json corpus/state/directory-published.json
                 corpus/state/maintenance.json corpus/state/inbox.json)
          for path in "${paths[@]}"; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated agent corpus"
            git push origin HEAD:main
          fi
      - name: Save bounded maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-evidence-${{ github.run_id }}
          path: |
            work/maintenance-summary.json
            corpus/state/catalog-cursor.json
            corpus/state/directory-cursor.json
            corpus/state/directory-published.json
            corpus/state/maintenance.json
            corpus/state/inbox.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report complete or partial refresh truthfully
        if: always()
        run: uv run --python 3.12 python scripts/run_maintenance.py --report
