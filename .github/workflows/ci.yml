name: CI

# Read-only PR/push checks: offline tests, vendor identity verification and the
# synthetic demo. No contents:write here, no pull_request_target, no maintenance.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Verify vendored wiki kernel against pinned Git blob identity
        run: uv run --python 3.12 python scripts/verify_vendor.py
      - name: Run offline test suite
        run: uv run --python 3.12 --extra dev python -m pytest tests -q --basetemp=${{ runner.temp }}/pt
      - name: Run synthetic two-class demonstration (fixture data only, no live network)
        run: uv run --python 3.12 python scripts/demo_synthetic.py --root ${{ runner.temp }}/demo-synthetic
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pt
            ${{ runner.temp }}/demo-synthetic
          if-no-files-found: ignore
          retention-days: 5
